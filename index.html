<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHINE MUSIX</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<header>

<div class="logo">SHINE MUSIX</div>

<div class="search-box">

<input type="text" id="searchInput" placeholder="Search Songs...">

<button onclick="searchSongs()">
🔍
</button>

</div>

</header>

<section class="hero">

<div class="hero-card">

<h1>Feel The Music 🎧</h1>

<p>
Search, stream, download and create playlists.
</p>

</div>

</section>

<h2 class="section-title">
Trending Playlists
</h2>

<div class="playlists">

<div class="playlist">
<img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=500">
<h3>Night Vibes</h3>
</div>

<div class="playlist">
<img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?q=80&w=500">
<h3>LoFi Chill</h3>
</div>

<div class="playlist">
<img src="https://images.unsplash.com/photo-1501386761578-eac5c94b800a?q=80&w=500">
<h3>Party Hits</h3>
</div>

</div>

<div class="playlist-create">

<button onclick="createPlaylist()">
＋ Create Playlist
</button>

</div>

<div id="userPlaylists"></div>

<h2 class="section-title">
Songs
</h2>

<div class="songs" id="songsContainer"></div>

<div class="player">

<div class="player-top">

<img id="playerImg" src="">

<div class="player-info">

<h4 id="playerTitle">
No Song Playing
</h4>

<p id="playerArtist">
---
</p>

<input
type="range"
class="seekbar"
id="seekbar"
value="0"
>

</div>

</div>

<div class="controls">

<button onclick="togglePlay()">
▶
</button>

</div>

<audio id="audio"></audio>

</div>

<script src="script.js"></script>

</body>
</html>
